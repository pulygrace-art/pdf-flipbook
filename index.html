<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 翻頁書</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
  :root {
    --bg: #2b2621;
    --bg-2: #3a332c;
    --fg: #f3ede4;
    --muted: #b8ad9e;
    --accent: #d9a35b;
    --panel: rgba(255,255,255,.06);
    --border: rgba(255,255,255,.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at center, var(--bg-2), var(--bg) 70%);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .05em; }
  header .name { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  button, .btn {
    background: var(--panel); color: var(--fg); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 14px; font-size: 14px; cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  button:hover, .btn:hover { background: rgba(255,255,255,.12); }
  button:disabled { opacity: .35; cursor: default; }
  .primary { background: var(--accent); color: #2b2621; border-color: var(--accent); font-weight: 600; }
  .primary:hover { background: #e6b26b; }

  main { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 16px; }

  /* 上傳區 */
  #drop {
    width: min(560px, 100%); padding: 48px 24px; text-align: center;
    border: 2px dashed var(--border); border-radius: 16px; background: var(--panel);
    transition: border-color .2s, background .2s;
  }
  #drop.over { border-color: var(--accent); background: rgba(217,163,91,.12); }
  #drop .icon { font-size: 48px; line-height: 1; margin-bottom: 12px; }
  #drop p { color: var(--muted); margin: 8px 0 20px; }

  #home { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-height: 100%; overflow-y: auto; }
  #shelf { display: none; width: min(560px, 100%); }
  #shelf h2 { font-size: 16px; margin: 0 0 10px; }
  #shelfList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  #shelfList li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
  #shelfList a { flex: 1; color: var(--fg); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #shelfList a:hover { color: var(--accent); }
  #shelfList button { font-size: 13px; padding: 5px 10px; }
  /* 分享模式：讀者只看書，不顯示上傳功能 */
  body.shared #changeBtn { display: none !important; }

  /* 進度 */
  #progress { width: min(420px, 100%); text-align: center; display: none; }
  #progress .bar { height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; margin-top: 12px; }
  #progress .fill { height: 100%; width: 0; background: var(--accent); transition: width .15s; }

  /* 書本 */
  #stage { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; }
  #book-wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .page { background: #fff; overflow: hidden; }
  .page img { width: 100%; height: 100%; display: block; object-fit: contain; user-select: none; -webkit-user-drag: none; }
  /* 書脊陰影 */
  .page.--left::after, .page.--right::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 40px; pointer-events: none;
  }
  .page.--left::after { right: 0; background: linear-gradient(to left, rgba(0,0,0,.18), transparent); }
  .page.--right::after { left: 0; background: linear-gradient(to right, rgba(0,0,0,.18), transparent); }

  footer {
    display: none; align-items: center; justify-content: center; gap: 10px;
    padding: 10px 16px; border-top: 1px solid var(--border);
  }
  footer input[type=range] { width: min(320px, 40vw); accent-color: var(--accent); }
  #pageInfo { min-width: 90px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }

  @media (max-width: 600px) {
    header h1 { font-size: 15px; }
    footer { gap: 6px; }
    footer input[type=range] { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>📖 PDF 翻頁書</h1>
  <span class="name" id="fileName"></span>
  <label class="btn" id="changeBtn" style="display:none">開啟其他 PDF
    <input type="file" accept="application/pdf" hidden id="fileInput2">
  </label>
  <button id="fsBtn" style="display:none" title="全螢幕">⛶</button>
</header>

<main>
  <div id="home">
  <div id="drop">
    <div class="icon">📄</div>
    <strong>把 PDF 拖曳到這裡</strong>
    <p>檔案只在你的瀏覽器中處理，不會上傳到任何伺服器</p>
    <label class="btn primary">選擇 PDF 檔案
      <input type="file" accept="application/pdf" hidden id="fileInput">
    </label>
  </div>

  <div id="shelf">
    <h2>📚 書架</h2>
    <ul id="shelfList"></ul>
  </div>
  </div>

  <div id="progress">
    <div id="progressText">正在讀取 PDF…</div>
    <div class="bar"><div class="fill" id="progressFill"></div></div>
  </div>

  <div id="stage"><div id="book-wrap"></div></div>
</main>

<footer id="controls">
  <button id="firstBtn" title="第一頁">⏮</button>
  <button id="prevBtn" title="上一頁 (←)">◀ 上一頁</button>
  <input type="range" id="slider" min="1" value="1">
  <span id="pageInfo">1 / 1</span>
  <button id="nextBtn" title="下一頁 (→)">下一頁 ▶</button>
  <button id="lastBtn" title="最後一頁">⏭</button>
</footer>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const $ = id => document.getElementById(id);
let pageFlip = null;
let blobUrls = [];
let totalPages = 0;

// ---------- 上傳 ----------
const drop = $('drop');
['dragenter', 'dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', ev => handleFile(ev.dataTransfer.files[0]));
// 書本顯示時也可以直接把新 PDF 拖進視窗
document.addEventListener('dragover', ev => ev.preventDefault());
document.addEventListener('drop', ev => { ev.preventDefault(); if (ev.target.closest('#drop')) return; handleFile(ev.dataTransfer.files[0]); });
$('fileInput').addEventListener('change', e => handleFile(e.target.files[0]));
$('fileInput2').addEventListener('change', e => handleFile(e.target.files[0]));

async function handleFile(file) {
  if (!file) return;
  if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
    alert('請選擇 PDF 檔案');
    return;
  }
  await loadPdf(file.name, async () => new Uint8Array(await file.arrayBuffer()));
}

async function loadPdf(name, getData) {
  showView('progress');
  setProgress(0, '正在讀取 PDF…');
  $('fileName').textContent = name;
  document.title = name.replace(/\.pdf$/i, '') + ' - PDF 翻頁書';

  try {
    const data = await getData();
    const pdf = await pdfjsLib.getDocument({ data }).promise;
    const pages = await renderPages(pdf);
    buildBook(pages);
  } catch (err) {
    console.error(err);
    alert('無法讀取這個 PDF：' + err.message);
    showView('drop');
  }
}

// ---------- 分享連結：?pdf=books/檔名.pdf ----------
const sharedPath = new URLSearchParams(location.search).get('pdf');
// 只允許網站內的相對路徑，避免被拿去載入其他網站的檔案
const isSafePath = p => p && /\.pdf$/i.test(p) && !/^[a-z]+:|^\/\/|\.\./i.test(p);
if (sharedPath) {
  if (isSafePath(sharedPath)) {
    document.body.classList.add('shared');
    loadPdf(sharedPath.split('/').pop(), async () => {
      const res = await fetch(sharedPath);
      if (!res.ok) throw new Error(`找不到檔案（${res.status}）`);
      return new Uint8Array(await res.arrayBuffer());
    });
  } else {
    alert('分享連結的檔案路徑不正確');
  }
}

// ---------- 書架：自動列出 GitHub repo 裡 books/ 資料夾的 PDF ----------
async function loadShelf() {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const repo = location.pathname.split('/').filter(Boolean)[0];
  if (!m || !repo) return;
  try {
    const res = await fetch(`https://api.github.com/repos/${m[1]}/${repo}/contents/books`);
    if (!res.ok) return;
    const files = (await res.json()).filter(f => f.type === 'file' && /\.pdf$/i.test(f.name));
    if (!files.length) return;
    const list = $('shelfList');
    files.forEach(f => {
      const link = shareUrl(f.path);
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = link;
      a.textContent = '📕 ' + f.name.replace(/\.pdf$/i, '');
      const copy = document.createElement('button');
      copy.textContent = '複製分享連結';
      copy.onclick = async () => {
        try { await navigator.clipboard.writeText(link); copy.textContent = '已複製 ✓'; }
        catch { prompt('複製這個連結：', link); }
        setTimeout(() => copy.textContent = '複製分享連結', 1500);
      };
      li.append(a, copy);
      list.appendChild(li);
    });
    $('shelf').style.display = 'block';
  } catch (e) { console.warn('書架載入失敗', e); }
}
function shareUrl(path) {
  return location.origin + location.pathname + '?pdf=' + encodeURIComponent(path).replace(/%2F/g, '/');
}
if (!sharedPath) loadShelf();

// ---------- 把每一頁轉成圖片 ----------
async function renderPages(pdf) {
  blobUrls.forEach(URL.revokeObjectURL);
  blobUrls = [];
  const n = pdf.numPages;
  const first = await pdf.getPage(1);
  const base = first.getViewport({ scale: 1 });
  // 依螢幕大小決定解析度：一頁約佔半個螢幕寬，再乘上 devicePixelRatio（上限 2）
  const targetW = Math.min(1400, Math.max(700, window.innerWidth / 2) * Math.min(window.devicePixelRatio || 1, 2));

  const result = [];
  for (let i = 1; i <= n; i++) {
    const page = i === 1 ? first : await pdf.getPage(i);
    const vp1 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: targetW / vp1.width });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(vp.width);
    canvas.height = Math.round(vp.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));
    const url = URL.createObjectURL(blob);
    blobUrls.push(url);
    result.push(url);
    page.cleanup();
    setProgress(i / n, `正在轉換頁面 ${i} / ${n}`);
  }
  return { urls: result, width: base.width, height: base.height };
}

// ---------- 建立翻頁書 ----------
let lastBook = null;
function buildBook({ urls, width, height }, startPage = 0) {
  lastBook = { urls, width, height };
  if (pageFlip) { try { pageFlip.destroy(); } catch (e) {} pageFlip = null; }
  const wrap = $('book-wrap');
  wrap.innerHTML = '';
  // 外層 sizer 控制書本尺寸（PageFlip 會覆寫書本元素本身的 width）
  const sizer = document.createElement('div');
  const book = document.createElement('div');
  sizer.appendChild(book);
  wrap.appendChild(sizer);

  urls.forEach((url, i) => {
    const p = document.createElement('div');
    p.className = 'page';
    // 封面與封底使用硬頁效果
    if (i === 0 || i === urls.length - 1) p.dataset.density = 'hard';
    const img = document.createElement('img');
    img.src = url;
    img.alt = `第 ${i + 1} 頁`;
    p.appendChild(img);
    book.appendChild(p);
  });

  showView('stage');
  pdfSize = { width, height };
  bookEl = sizer;
  const { w, h } = sizeBook();

  pageFlip = new St.PageFlip(book, {
    width: w,
    height: h,
    size: 'stretch',
    // 容器寬度 < 2 × minWidth 時 PageFlip 會切成單頁；設成單頁寬讓窄螢幕自動單頁顯示
    minWidth: Math.max(1, w - 1),
    maxWidth: 2000,
    minHeight: 200,
    maxHeight: 2800,
    showCover: true,
    usePortrait: true,          // 窄螢幕自動切換為單頁
    maxShadowOpacity: 0.5,
    flippingTime: 800,
    mobileScrollSupport: false,
    autoSize: true,
    startPage,
  });
  pageFlip.loadFromHTML(book.querySelectorAll('.page'));

  totalPages = urls.length;
  $('slider').max = totalPages;
  pageFlip.on('flip', e => updateInfo(e.data));
  pageFlip.on('changeOrientation', () => updateInfo(pageFlip.getCurrentPageIndex()));
  updateInfo(pageFlip.getCurrentPageIndex());
}

// 把書本容器設成剛好放得下（雙頁或單頁），stretch 模式會依容器大小縮放
let pdfSize = null, bookEl = null;
function sizeBook() {
  const { w, h } = fitPageSize(pdfSize.width, pdfSize.height);
  const spread = document.querySelector('main').clientWidth - 32 > 700 ? 2 : 1;
  bookEl.style.width = w * spread + 'px';
  bookEl.style.height = h + 'px';
  return { w, h };
}
// 視窗尺寸改變時重建書本，保留目前頁數（單頁 / 雙頁會依新寬度重新判斷）
let resizeTimer;
window.addEventListener('resize', () => {
  if (!pageFlip || !lastBook) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => buildBook(lastBook, pageFlip.getCurrentPageIndex()), 200);
});

// 依可用空間算出單頁大小（維持 PDF 長寬比）
function fitPageSize(pw, ph) {
  const main = document.querySelector('main');
  const availW = main.clientWidth - 32;
  const availH = main.clientHeight - 32;
  const spread = availW > 700 ? 2 : 1;
  const ratio = ph / pw;
  let w = availW / spread;
  let h = w * ratio;
  if (h > availH) { h = availH; w = h / ratio; }
  // 視窗尚未完成排版（例如分頁在背景）時，先用 PDF 原尺寸，stretch 模式會再自動調整
  if (!(w > 0 && h > 0)) { w = pw; h = ph; }
  return { w: Math.floor(w), h: Math.floor(h) };
}

function updateInfo(idx) {
  const portrait = pageFlip.getOrientation() === 'portrait';
  let label;
  if (portrait || idx === 0 || idx >= totalPages - 1) {
    label = `${idx + 1} / ${totalPages}`;
  } else {
    const left = idx % 2 === 1 ? idx : idx - 1;
    label = `${left + 1}-${Math.min(left + 2, totalPages)} / ${totalPages}`;
  }
  $('pageInfo').textContent = label;
  $('slider').value = idx + 1;
  $('prevBtn').disabled = $('firstBtn').disabled = idx === 0;
  const atEnd = portrait ? idx >= totalPages - 1 : idx + 2 >= totalPages && idx !== 0 || totalPages === 1;
  $('nextBtn').disabled = $('lastBtn').disabled = atEnd;
}

// ---------- 控制 ----------
$('prevBtn').onclick = () => pageFlip && pageFlip.flipPrev();
$('nextBtn').onclick = () => pageFlip && pageFlip.flipNext();
$('firstBtn').onclick = () => pageFlip && pageFlip.flip(0);
$('lastBtn').onclick = () => pageFlip && pageFlip.flip(totalPages - 1);
$('slider').oninput = e => {
  if (!pageFlip) return;
  const idx = +e.target.value - 1;
  pageFlip.turnToPage(idx);
  updateInfo(pageFlip.getCurrentPageIndex());
};
document.addEventListener('keydown', e => {
  if (!pageFlip) return;
  if (e.key === 'ArrowLeft') pageFlip.flipPrev();
  if (e.key === 'ArrowRight') pageFlip.flipNext();
});
$('fsBtn').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
};

// ---------- 畫面切換 ----------
function showView(v) {
  $('drop').style.display = v === 'drop' ? 'block' : 'none';
  $('home').style.display = v === 'drop' ? 'flex' : 'none';
  $('progress').style.display = v === 'progress' ? 'block' : 'none';
  $('stage').style.display = v === 'stage' ? 'flex' : 'none';
  $('controls').style.display = v === 'stage' ? 'flex' : 'none';
  $('changeBtn').style.display = v === 'stage' ? 'inline-block' : 'none';
  $('fsBtn').style.display = v === 'stage' ? 'inline-block' : 'none';
}
function setProgress(r, text) {
  $('progressFill').style.width = (r * 100) + '%';
  $('progressText').textContent = text;
}
</script>
</body>
</html>
